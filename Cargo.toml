[package]
name = "citac"
version = "0.13.0"
edition = "2024"
description = "Cross-platform book and comic reader"

[lib]
path = "src/android.rs"
crate-type = ["cdylib"]

[features]
default = ["qt-epub"]
qt-epub = []

[dependencies]
directories = "=6.0.0"
encoding_rs = "=0.8.42"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
percent-encoding = "=2.3.2"
resvg = { version = "=0.48.1", default-features = false, features = ["text", "raster-images"] }
roxmltree = "=0.21.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.11.0"
slint = { version = "=1.18.1", features = ["backend-android-activity-06"] }
tempfile = "=3.27.0"
unrar = "=0.5.8"
walkdir = "=2.5.0"
zip = { version = "=3.0.0", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "=0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"

[build-dependencies]
slint-build = "=1.18.1"

[patch.crates-io]
unrar_sys = { path = "vendor/unrar_sys" }

[package.metadata.android]
package = "rs.citac.reader"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Reader"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.signing.dev]
path = "target/android-debug.keystore"
keystore_password = "android"

[package.metadata.android.signing.release]
path = "target/android-debug.keystore"
keystore_password = "android"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
